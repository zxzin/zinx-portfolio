name: Deploy Zinx portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve GitHub Pages base path
        id: base
        shell: bash
        run: |
          repo_name="$(basename "$GITHUB_REPOSITORY")"
          if [[ "$repo_name" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo_name/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      - name: Build and test
        run: npm test
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.base }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
